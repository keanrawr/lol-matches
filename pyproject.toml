[project]
name = "lol_matches"
version = "0.1.0"
description = "Python streamer for league of legends matches"
readme = "README.md"
authors = [{name = "keanrawr"}]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.42.9",
    "matplotlib>=3.10.8",
    "mlflow>=3.7.0",
    "pandas>=2.3.3",
    "pyarrow>=22.0.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "riotwatcher>=3.3.1",
    "scikit-learn>=1.8.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.14.9",
]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["databricks"]

[tool.ruff.lint]
select = [
  "E",  # pycodestyle errors
  "W",  # pycodestyle warnings
  "F",  # pyflakes
  "I",  # isort
  "B",  # flake8-bugbear
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade
  "ARG001", # unused arguments in functions
]
ignore = [
  "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.pycodestyle]
max-line-length = 120
